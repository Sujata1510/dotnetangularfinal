    <div class="dashboard-container viewer-theme">
      <header class="dashboard-header">
        <h1>Read-Only Reporting Dashboard</h1>
        <div class="user-info">
          <span>Welcome, <strong>{{ authService.currentUser()?.fullName }}</strong> (Viewer)</span>
          <button (click)="authService.logout()" class="btn-logout">Logout</button>
        </div>
      </header>

      <section class="metrics-grid">
        <div class="card"><h3>Public Analytics</h3><p class="stat">Active</p></div>
        <div class="card"><h3>Published Reports</h3><p class="stat">28</p></div>
      </section>

      <section class="viewer-actions">
        <h2>Reporting Center</h2>
        <p>Privileges granted: Read-only access to published reports and general project statistics.</p>
      </section>
    </div>
