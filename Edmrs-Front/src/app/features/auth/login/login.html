    <div class="login-wrapper">
      <div class="login-card">
        <h2>EDMRS System Login</h2>
        <p class="subtitle">Enter your credentials to access your dashboard</p>

        <div *ngIf="errorMessage()" class="alert-error">
          {{ errorMessage() }}
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" formControlName="email" placeholder="user@edmrs.com" />
            <small *ngIf="email?.invalid && email?.touched" class="err-text">Valid email is required</small>
          </div>

          <div class="form-group">
            <label>Password</label>
            <input type="password" formControlName="password" placeholder="••••••••" />
            <small *ngIf="password?.invalid && password?.touched" class="err-text">Password is required</small>
          </div>

          <button type="submit" [disabled]="loginForm.invalid || isLoading()" class="btn-primary">
            {{ isLoading() ? 'Authenticating...' : 'Sign In' }}
          </button>
        </form>
      </div>
    </div>
