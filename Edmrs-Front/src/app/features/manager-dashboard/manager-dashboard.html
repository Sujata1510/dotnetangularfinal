 <div class="dashboard-container manager-theme">
      <header class="dashboard-header">
        <h1>Manager Portal</h1>
        <div class="user-info">
          <span>Welcome, <strong>{{ authService.currentUser()?.fullName }}</strong> (Manager)</span>
          <button (click)="authService.logout()" class="btn-logout">Logout</button>
        </div>
      </header>

      <section class="metrics-grid">
        <div class="card"><h3>Team Employees</h3><p class="stat">42</p></div>
        <div class="card"><h3>Department Projects</h3><p class="stat">14</p></div>
        <div class="card"><h3>Pending Approvals</h3><p class="stat">5</p></div>
      </section>

      <section class="manager-actions">
        <h2>Departmental Operations</h2>
        <p>Privileges granted: Employee Management, Project Allocations, Lookup Data Viewing.</p>
      </section>
    </div>
